; KH 1.5+2.5 Hotfix settings. Delete a line to use the default value.

; Number of most recent versions kept per save file, plus one version per day for BackupDailyDays days.
BackupKeep=40
BackupDailyDays=30

; Restore the last good backup before launch when a save is provably damaged (truncated/empty/broken).
AutoHeal=1

; While the game runs, switch the primary monitor to this refresh rate and restore the original one on exit.
; 0 = never touch the display (default).
TargetRefreshHz=0

; Close a KH game process that closed its window but never exited (the "Quit Game" freeze). 0 = off.
; Fallback only: FixQuitCrash below removes the cause.
QuitHangKillSeconds=20

; Close a KH window that has been "Not responding" for this many seconds. 0 = off.
HungWindowKillSeconds=120

; Seconds without any KH process before the session ends (covers launcher <-> game switches).
ExitGraceSeconds=8

; Global hotkey that backs up saves and force-closes a frozen game. Empty = disabled.
PanicHotkey=Ctrl+Alt+K

; Show dialogs and notifications about things that need your attention, e.g. a damaged save that was restored or a
; lost sound output (0 = only write them to Logs\).
ShowDialogs=1

; 1 = also show what the hotfix handled by itself (released loading screens, closed frozen games, crash reports).
; These are always written to Logs\ and included in the Discord reports.
DetailedMessages=0

; Extra arguments for the game, e.g. -reboot=true skips the logo videos before the launcher.
ExtraGameArgs=

; Code fix for the "Quit Game" crash/freeze, applied to the running game in memory (game files are not changed).
; It is only applied when the game's code matches the known version exactly. 0 = off.
FixQuitCrash=1

; KINGDOM HEARTS FINAL MIX: endless loading screen (the loading icon keeps spinning, the game never continues) and
; cutscenes that freeze at their end. Both happen after the game's sound output failed (its audio device disappeared
; while no other output was enabled): sounds never finish any more, and loads and cutscenes wait for them. After such a
; failure loads are released at once and sounds stuck for 5 s are marked finished; without it, a load blocked by a busy
; voice slot is released after this many seconds. 0 = only report, never change the game.
LoadingRescueSeconds=10

; Override the saves folder (default: Documents\My Games\KINGDOM HEARTS HD 1.5+2.5 ReMIX).
SavesRoot=

; ---- Reports to the developer ------------------------------------------------------------------------------------
; Hotkey that captures the moment (screenshot, game state, technical snapshot) and opens the "Report a bug" window.
; Also: Start menu > KH Hotfix > Report a KINGDOM HEARTS bug. Empty = no hotkey.
BugReportHotkey=Ctrl+Alt+B

; Send crash and freeze reports, and notes about sessions in which the hotfix had to step in (lost sound, released
; loading screens, deleted saves), to the developer automatically. 0 = never send anything by itself.
; What is sent: logs, the crash report with a snapshot of the game's memory, and system information (Windows, CPU, GPU,
; display, audio outputs, settings). Your Windows user name, PC name and Steam ID are removed from the logs.
AutoReports=1

; Reports travel through the KH Hotfix report server to the developer's Discord. ReportRelay= (empty) in
; KHHotfix.local.ini turns all reporting off. The maintainer can post straight to Discord webhooks instead, set in
; KHHotfix.local.ini (never publish webhook URLs: anyone who has one can post to and delete it):
;   DiscordBugReportWebhook=  DiscordLogWebhook=  DiscordBugReportTags=  (ids of required forum tags)
